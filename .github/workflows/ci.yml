name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Node 22 / PostgreSQL 17 quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: movieflix
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/movieflix
      DIRECT_DATABASE_URL: postgresql://postgres:password@localhost:5432/movieflix
      DATABASE_DRIVER: pg
      ALLOW_INSECURE_POSTGRES: "true"
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: https://www.movieflix.site
      NEXT_PUBLIC_APP_URL: https://www.movieflix.site
      SEO_INDEXING_ENABLED: "false"
      IMPORT_EXECUTION_MODE: local
      APP_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Prisma validation and migration test
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate status
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:imports
      - run: pnpm test:seo
      - run: pnpm build

  docker-fallback:
    name: Docker fallback image validation
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: movieflix
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare fallback build database
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/movieflix
          DIRECT_DATABASE_URL: postgresql://postgres:password@localhost:5432/movieflix
        run: pnpm exec prisma migrate deploy
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: movieflix:${{ github.sha }}
          network: host
          build-args: |
            DATABASE_URL=postgresql://postgres:password@127.0.0.1:5432/movieflix
          cache-from: type=gha
          cache-to: type=gha,mode=max
